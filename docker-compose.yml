version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: paycore_postgres
    environment:
      POSTGRES_DB: paycore
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: paycore_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: paycore_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password123@postgres:5432/paycore
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: paycore_super_secret_jwt_key_2026_change_in_production
      FRONTEND_URL: http://localhost:5173
      API_URL: http://localhost:8000
      SANDBOX_ENABLED: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: paycore_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
