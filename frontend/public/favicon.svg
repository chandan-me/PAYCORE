<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#6851FF"/>
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D284"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect x="6" y="6" width="88" height="88" rx="26" fill="url(#bgGrad)" />

  <!-- Inner Soft Ring -->
  <rect x="6" y="6" width="88" height="88" rx="26" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>

  <!-- Stylish "P" Geometric Payment Loop -->
  <path d="M 32 72 L 32 28 L 54 28 C 66 28 73 34 73 44 C 73 54 66 60 54 60 L 44 60 L 44 72 Z" fill="#FFFFFF" />
  <path d="M 44 39 L 52 39 C 58 39 62 41 62 44 C 62 47 58 49 52 49 L 44 49 Z" fill="url(#bgGrad)" />

  <!-- Vibrant Fintech Spark Node -->
  <circle cx="68" cy="30" r="7" fill="url(#sparkGrad)" filter="url(#glow)"/>
  <circle cx="68" cy="30" r="3.5" fill="#FFFFFF"/>
</svg>